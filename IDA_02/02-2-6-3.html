<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let i;
        document.write("continueの例<br>");
        for(i=1;i<10;i++){
            if(i%2 == 0){
                continue;
            }
            document.write(i+"<br>");
        }
        document.write("<br>");
        document.write("breakの例<br>");
        for(i=1;i<10;i++){
            if(i == 5){
                break;
            }
            document.write(i+"<br>");
        }

    </script>
</body>
</html>
