<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sum(n){
            let a = 0;
            let sum = 0;
            while(a++ < n){
                sum += a;
                document.write("a: "+a+", sum: "+sum+"<br>");
            }
        }
        sum(20);
    </script>
</body>
</html>
